<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PATA OWNER 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:20px}
.top{border:2px solid #FFD700;border-radius:15px;padding:20px;text-align:center;background:linear-gradient(135deg,#111,#222)}
h1{color:#FFD700;font-size:28px}
.sub{color:#aaa;margin:10px 0}
.badge{display:inline-block;background:#FFD700;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold;margin-top:10px}
.card{background:#111;border:1px solid #333;border-radius:15px;padding:15px;margin-top:15px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}
.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.stat{background:#000;border:1px solid #FFD700;border-radius:10px;padding:15px;text-align:center}
.stat b{color:#FFD700;font-size:20px;display:block}
.hidden{display:none}
.live{color:#0f0}
</style></head><body>
<div class="top"><h1>PATA 👑 OWNER</h1><p class="sub">BUILT 100% ON PHONE IN THIKA</p><div class="badge">CEO ACCESS ONLY</div></div>
<div id="loginBox" class="card"><h3>CEO Login 🔐</h3>
<input id="phone" placeholder="Phone: 0798005771" value="0798005771">
<input id="pass" type="password" placeholder="Password" value="Pata@2025Owner">
<button class="btn" onclick="login()">INGIA CEO 👑</button>
<p id="msg" style="text-align:center;margin-top:10px;color:#f00"></p></div>
<div id="dash" class="hidden">
<div class="card"><h3>Welcome CEO Wycliffe! 👑</h3><p>Live Backend: <span class="live">pata-backend-4y5n.onrender.com</span></p>
<button class="btn" style="background:#f00;color:#fff" onclick="logout()">Logout</button></div>
<div class="stats">
<div class="stat"><b id="total">0</b>Users</div>
<div class="stat"><b id="workers">0</b>Workers</div>
<div class="stat"><b id="clients">0</b>Clients</div>
<div class="stat"><b id="jobs">0</b>Jobs</div>
</div>
<div class="card"><h3>All Users</h3><div id="users">Loading...</div>
<button class="btn" onclick="load()">Refresh 🔄</button></div>
</div>
<script>
const API="https://pata-backend-4y5n.onrender.com";
function login(){
if(phone.value!=="0798005771"||pass.value!=="Pata@2025Owner"){msg.innerText="Wrong! Use 0798005771 / Pata@2025Owner";return}
localStorage.setItem("isOwner","1");loginBox.classList.add("hidden");dash.classList.remove("hidden");load()
}
function logout(){localStorage.removeItem("isOwner");location.reload()}
async function load(){
try{
let r=await fetch(API+"/users");let d=await r.json();
let u=d.users||d||[];total.innerText=u.length;
workers.innerText=u.filter(x=>x.role==="worker"||x.userType==="worker").length;
clients.innerText=u.filter(x=>x.role==="client"||x.userType==="client").length;
jobs.innerText="0";
users.innerHTML=u.map(x=>`<div style="padding:8px;border-bottom:1px solid #333">${x.name||x.fullName||"No name"} - ${x.phone} - ${x.role||x.userType||"user"}</div>`).join("")||"No users";
}catch(e){users.innerText="Error: "+e.message+" - Backend maybe sleeping, wait 30s"}}
if(localStorage.getItem("isOwner")){loginBox.classList.add("hidden");dash.classList.remove("hidden");load()}
</script></body></html>
