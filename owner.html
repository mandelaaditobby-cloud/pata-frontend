<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PATA OWNER - TOBBY</title>
<style>body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:20px}h1{font-size:40px} .box{background:#111;border:2px solid #FFD700;padding:20px;border-radius:15px;margin:20px auto;max-width:500px} button{background:#FFD700;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer} input{padding:10px;width:80%;margin:10px;border-radius:8px;border:none}</style>
</head><body>
<h1>PATA OWNER</h1>
<p>BUILT 100% ON PHONE IN THIKA BY TOBBY</p>
<div class="box">
<h2>Welcome CEO TOBBY! 🔥</h2>
<p id="status">Checking backend...</p>
<p>Backend: pata-backend-4y5n.onrender.com</p>
<input id="phone" placeholder="07..."><br>
<button onclick="check()">Check My Sales</button>
<button onclick="location.href='https://pata-frontend-phi.vercel.app'">Go To PATA App</button>
<div id="out"></div>
</div>
<script>
const API='https://pata-backend-4y5n.onrender.com';
fetch(API+'/').then(r=>r.json()).then(d=>{document.getElementById('status').innerHTML='✅ Backend LIVE: '+d.message}).catch(e=>{document.getElementById('status').innerHTML='❌ Backend sleeping - open '+API+' in new tab to wake'});
function check(){const p=document.getElementById('phone').value; if(!p) return alert('Weka namba'); fetch(API+'/api/rides/history?phone='+p).then(r=>r.json()).then(d=>{document.getElementById('out').innerHTML='<h3>Found '+d.length+' rides</h3><pre style=text-align:left;overflow:auto>'+JSON.stringify(d.slice(0,5),null,2)+'</pre>'}).catch(e=>{document.getElementById('out').innerHTML='Error: '+e})}
</script>
</body></html>
