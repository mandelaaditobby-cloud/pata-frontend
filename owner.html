<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATA OWNER 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;min-height:100vh;padding:20px}
.top{border:2px solid #FFD700;border-radius:15px;padding:20px;text-align:center;background:linear-gradient(135deg,#111,#222)}
h1{color:#FFD700;font-size:28px}
.sub{color:#aaa;margin:10px 0}
.badge{display:inline-block;background:#FFD700;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold;margin-top:10px}
.card{background:#111;border:1px solid #333;border-radius:15px;padding:15px;margin-top:15px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}
.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.stat{background:#000;border:1px solid #FFD700;border-radius:10px;padding:15px;text-align:center}
.stat b{color:#FFD700;font-size:20px;display:block}
.hidden{display:none}
.live{color:#0f0}
</style>
</head>
<body>
<div class="top">
<h1>PATA 👑 OWNER</h1>
<p class="sub">BUILT 100% ON PHONE IN THIKA</p>
<div class="badge">CEO ACCESS ONLY</div>
