<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATA OWNER 👑</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;min-height:100vh;padding:20px}.top{border:2px solid #FFD700;border-radius:15px;padding:20px;text-align:center;background:linear-gradient(135deg,#111,#222)}h1{color:#FFD700;font-size:28px}.sub{color:#aaa;margin:10px 0}.badge{display:inline-block;background:#FFD700;color:#000;padding:5px 15px;border-radius:20px;font-weight:bold;margin-top:10px}.card{background:#111;border:1px solid #333;border-radius:15px;padding:15px;margin-top:15px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}.btn{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stat{background:#000;border:1px solid #FFD700;border-radius:10px;padding:15px;text-align:center}.stat b{color:#FFD700;font-size:20px;display:block}.hidden{display:none}.live{color:#0f0}</style></head><body><div class="top"><h1>PATA 👑 OWNER</h1><p class="sub">BUILT 100% ON PHONE IN THIKA BY TOBBY</p><div class="badge">CEO ACCESS ONLY</div><h2 style="margin-top:15px">Welcome CEO TOBBY! 🔥</h2><p id="status" class="sub">Connecting...</p></div><div class="card"><h3>🔐 CEO Login</h3><input id="pin" type="password" placeholder="Enter CEO PIN"><button class="btn" onclick="login()">UNLOCK DASHBOARD</button><p id="loginMsg" class="sub"></p></div><div id="dash" class="hidden"><div class="stats"><div class="stat"><b id="users">0</b>Users</div><div class="stat"><b id="workers">0</b>Workers</div><div class="stat"><b id="clients">0</b>Clients</div><div class="stat"><b id="jobs">0</b>Jobs</div></div><div class="card"><h3>📊 Live Data</h3><div id="data">Loading...</div><button class="btn" onclick="loadData()">REFRESH 🔄</button></div></div><script>const API="https://pata-backend-4y5n.onrender.com";const CEO_PIN="PATA2024";function login(){if(document.getElementById('pin').value===CEO_PIN){document.getElementById('dash').classList.remove('hidden');document.getElementById('loginMsg').innerHTML="<span class='live'>✅ UNLOCKED - Welcome Boss TOBBY!</span>";loadData();}else{document.getElementById('loginMsg').innerText="❌ Wrong PIN";}}async function loadData(){document.getElementById('status').innerText="Fetching...";try{const r=await fetch(API+"/api/stats");const d=await r.json();document.getElementById('users').innerText=d.users||0;document.getElementById('workers').innerText=d.workers||0;document.getElementById('clients').innerText=d.clients||0;document.getElementById('jobs').innerText=d.jobs||0;document.getElementById('data').innerHTML="<pre style='color:#0f0'>"+JSON.stringify(d,null,2)+"</pre>";document.getElementById('status').innerHTML="<span class='live'>● LIVE - Backend Connected</span>";}catch(e){document.getElementById('status').innerText="Error: Backend sleeping, wait 30s then Refresh";document.getElementById('data').innerText=e;}}loadData();</script></body></html>
